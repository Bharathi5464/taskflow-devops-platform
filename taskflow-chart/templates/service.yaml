apiVersion: v1
kind: Service
metadata:
  name: {{ include "taskflow-chart.fullname" . }}
  labels:
    {{- include "taskflow-chart.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "taskflow-chart.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http