{{- if .Values.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "taskflow-chart.fullname" . }}-prometheus-config
  labels:
    {{- include "taskflow-chart.labels" . | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.prometheus.scrapeInterval }}

    scrape_configs:
      - job_name: "taskflow"
        static_configs:
          - targets:
              - "{{ include "taskflow-chart.fullname" . }}:{{ .Values.prometheus.taskflowTargetPort }}"

      {{- if .Values.prometheus.kubeStateMetrics.enabled }}
      - job_name: "kube-state-metrics"
        static_configs:
          - targets:
              - "{{ .Values.prometheus.kubeStateMetrics.serviceName }}:{{ .Values.prometheus.kubeStateMetrics.port }}"
      {{- end }}
{{- end }}
