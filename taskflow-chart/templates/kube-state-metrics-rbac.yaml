{{- if .Values.prometheus.kubeStateMetrics.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.prometheus.kubeStateMetrics.serviceName }}
  labels:
    {{- include "taskflow-chart.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - services
      - resourcequotas
      - replicationcontrollers
      - namespaces
    verbs:
      - list
      - watch

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs:
      - list
      - watch

  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs:
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.prometheus.kubeStateMetrics.serviceName }}
  labels:
    {{- include "taskflow-chart.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.prometheus.kubeStateMetrics.serviceName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.prometheus.kubeStateMetrics.serviceName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
