apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: taskflow
  template:
    metadata:
      labels:
        app: taskflow
    spec:
      containers:
        - name: taskflow-container
          image: taskflow-app:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
