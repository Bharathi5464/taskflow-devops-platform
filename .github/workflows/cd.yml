name: TaskFlow CD Pipeline
on:
  workflow_run:
    workflows: ["TaskFlow CI Pipeline"]
    types:
      - completed
env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: aws-terraform-platform-taskflow
  IMAGE_TAG: latest

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      #Docker
      - name: Build Docker Image
        run: |
          docker build -t taskflow-app:latest .
      - name: Tag Docker Image
        run: |
          docker tag taskflow-app:latest \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
      - name: Push Docker Image
        run: |
          docker push \
          ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
      - name: Install SSH Client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
      - name: Verify SSH Connection
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "echo 'Connected to EC2 successfully'"
      
      - name: Deploy Application on EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
          ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            aws ecr get-login-password --region ap-south-1 | \
            docker login \
            --username AWS \
            --password-stdin \
            588229931808.dkr.ecr.ap-south-1.amazonaws.com
      
            docker pull 588229931808.dkr.ecr.ap-south-1.amazonaws.com/aws-terraform-platform-taskflow:latest
      
            docker stop taskflow-app || true
      
            docker rm taskflow-app || true

            docker run -d \
              --name taskflow-app \
              -p 5000:5000 \
              --restart unless-stopped \
              588229931808.dkr.ecr.ap-south-1.amazonaws.com/aws-terraform-platform-taskflow:latest
      
          EOF






