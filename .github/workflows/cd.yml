name: TaskFlow CD Pipeline

on:
  workflow_run:
    workflows: ["TaskFlow CI Pipeline"]
    types:
      - completed

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: aws-terraform-platform-taskflow
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:

      # Checkout exact commit that passed CI
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push image
      - name: Build and Push Docker Image
        run: |
          docker build -t taskflow-app:${IMAGE_TAG} .

          docker tag taskflow-app:${IMAGE_TAG} \
            ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}

      # Install SSH client
      - name: Install SSH Client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      # Load EC2 SSH key
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # Test SSH
      - name: Test EC2 SSH
        run: |
          EC2_HOST=$(echo "${{ secrets.EC2_HOST }}" | tr -d '[:space:]')
          EC2_USERNAME=$(echo "${{ secrets.EC2_USERNAME }}" | tr -d '[:space:]')

          ssh -o StrictHostKeyChecking=no \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "echo 'EC2 SSH connection successful'"

      # Install Helm on EC2
      - name: Install Helm on EC2
        run: |
          EC2_HOST=$(echo "${{ secrets.EC2_HOST }}" | tr -d '[:space:]')
          EC2_USERNAME=$(echo "${{ secrets.EC2_USERNAME }}" | tr -d '[:space:]')

          cat > install-helm.sh << 'SCRIPT'
          #!/bin/bash

          set -e

          if command -v helm >/dev/null 2>&1; then
            echo "Helm already installed"
            exit 0
          fi

          echo "Installing Helm v3.19.0..."

          HELM_VERSION="v3.19.0"

          curl -fsSL \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            -o /tmp/helm.tar.gz

          tar -xzf /tmp/helm.tar.gz -C /tmp

          sudo install -m 0755 \
            /tmp/linux-amd64/helm \
            /usr/local/bin/helm

          rm -rf /tmp/helm.tar.gz /tmp/linux-amd64

          echo "Helm installed successfully"
          SCRIPT

          chmod +x install-helm.sh

          scp -o StrictHostKeyChecking=no \
            install-helm.sh \
            "${EC2_USERNAME}@${EC2_HOST}:/tmp/install-helm.sh"

          ssh -o StrictHostKeyChecking=no \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "bash /tmp/install-helm.sh"

          ssh -o StrictHostKeyChecking=no \
            "${EC2_USERNAME}@${EC2_HOST}" \
            "command -v helm && helm version --short"

      ## Deploy TaskFlow platform to Kind cluster on EC2
      - name: Deploy to EC2 Kubernetes
        run: |
          EC2_HOST=$(echo "${{ secrets.EC2_HOST }}" | tr -d '[:space:]')
          EC2_USERNAME=$(echo "${{ secrets.EC2_USERNAME }}" | tr -d '[:space:]')

          ssh -o StrictHostKeyChecking=no \
            "${EC2_USERNAME}@${EC2_HOST}" \
            'bash -s' << EOF

          set -e

          REPO_DIR=/home/ec2-user/taskflow-project

          if [ ! -d "\$REPO_DIR/.git" ]; then
            git clone \
              https://github.com/Bharathi5464/taskflow-devops-platform.git \
              "\$REPO_DIR"
          fi

          cd "\$REPO_DIR"

          git fetch origin
          git reset --hard
          git clean -fd
          git checkout "${IMAGE_TAG}"

          kubectl create namespace taskflow \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          ECR_PASSWORD=\$(aws ecr get-login-password \
            --region "${AWS_REGION}")

          kubectl create secret docker-registry ecr-registry-secret \
            --docker-server="${{ steps.login-ecr.outputs.registry }}" \
            --docker-username=AWS \
            --docker-password="\$ECR_PASSWORD" \
            -n taskflow \
            --dry-run=client \
            -o yaml | kubectl apply -f -

            # Adopt existing monitoring resources into Helm ownership
            kubectl label serviceaccount kube-state-metrics \
              app.kubernetes.io/managed-by=Helm \
              -n taskflow --overwrite

            kubectl annotate serviceaccount kube-state-metrics \
              meta.helm.sh/release-name=taskflow \
              meta.helm.sh/release-namespace=taskflow \
              -n taskflow --overwrite

            kubectl label clusterrole kube-state-metrics \
              app.kubernetes.io/managed-by=Helm \
              --overwrite

            kubectl annotate clusterrole kube-state-metrics \
              meta.helm.sh/release-name=taskflow \
              meta.helm.sh/release-namespace=taskflow \
              --overwrite

            kubectl label clusterrolebinding kube-state-metrics \
              app.kubernetes.io/managed-by=Helm \
              --overwrite

            kubectl annotate clusterrolebinding kube-state-metrics \
              meta.helm.sh/release-name=taskflow \
              meta.helm.sh/release-namespace=taskflow \
              --overwrite

            kubectl label service kube-state-metrics \
              app.kubernetes.io/managed-by=Helm \
              -n taskflow --overwrite

            kubectl annotate service kube-state-metrics \
              meta.helm.sh/release-name=taskflow \
              meta.helm.sh/release-namespace=taskflow \
              -n taskflow --overwrite

            kubectl label deployment kube-state-metrics \
              app.kubernetes.io/managed-by=Helm \
              -n taskflow --overwrite

            kubectl annotate deployment kube-state-metrics \
              meta.helm.sh/release-name=taskflow \
              meta.helm.sh/release-namespace=taskflow \
              -n taskflow --overwrite

          helm upgrade --install taskflow ./taskflow-chart \
            --namespace taskflow \
            --set image.repository="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}" \
            --set image.tag="${IMAGE_TAG}" \
            --set image.pullPolicy=Always \
            --wait \
            --timeout 180s \
            --atomic

          kubectl rollout status \
            deployment/taskflow-taskflow-chart \
            -n taskflow \
            --timeout=180s

          kubectl rollout status deployment/taskflow-taskflow-chart-prometheus \
            -n taskflow \
            --timeout=180s
          kubectl rollout status deployment/taskflow-taskflow-chart-grafana \
            -n taskflow \
            --timeout=180s

          kubectl rollout status deployment/kube-state-metrics \
            -n taskflow \
            --timeout=180s

          kubectl get pods -n taskflow

          EOF