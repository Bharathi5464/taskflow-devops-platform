name: TaskFlow CD Pipeline

on:
  workflow_run:
    workflows: ["TaskFlow CI Pipeline"]
    types:
      - completed

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: aws-terraform-platform-taskflow
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t taskflow-app:${{ env.IMAGE_TAG }} .

      - name: Tag Docker Image
        run: |
          docker tag taskflow-app:${{ env.IMAGE_TAG }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Push Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Install SSH Client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # ---------------------------------------------------------
      # STEP 1: Verify EC2 + Helm
      # ---------------------------------------------------------

      - name: Verify EC2 and Helm
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << EOF

            set -e

            echo "=== EC2 Connected ==="
            whoami
            hostname

            echo "=== Helm ==="
            command -v helm || true
            helm version --short

          EOF

      # ---------------------------------------------------------
      # STEP 2: Deploy
      # ---------------------------------------------------------

      - name: Deploy Application to Kubernetes
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << EOF

            set -e

            REPO_DIR=/home/ec2-user/taskflow-project

            echo "=== Repository ==="

            if [ ! -d "\$REPO_DIR/.git" ]; then
              git clone \
                https://github.com/Bharathi5464/taskflow-devops-platform.git \
                "\$REPO_DIR"
            fi

            cd "\$REPO_DIR"

            git fetch origin
            git reset --hard
            git clean -fd
            git checkout ${IMAGE_TAG}

            echo "Commit:"
            git rev-parse --short HEAD

            echo "=== Helm ==="
            helm version --short

            echo "=== Kubernetes ==="
            kubectl version --client

            echo "=== Namespace ==="

            kubectl create namespace taskflow \
              --dry-run=client \
              -o yaml | kubectl apply -f -

            echo "=== ECR Login Secret ==="

            ECR_PASSWORD=\$(aws ecr get-login-password \
              --region ${AWS_REGION})

            kubectl create secret docker-registry ecr-registry-secret \
              --docker-server=${{ steps.login-ecr.outputs.registry }} \
              --docker-username=AWS \
              --docker-password="\$ECR_PASSWORD" \
              -n taskflow \
              --dry-run=client \
              -o yaml | kubectl apply -f -

            echo "=== Helm Deployment ==="

            helm upgrade --install taskflow ./taskflow-chart \
              --namespace taskflow \
              --set image.repository=${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY} \
              --set image.tag=${IMAGE_TAG} \
              --set image.pullPolicy=Always \
              --wait \
              --timeout 180s \
              --atomic

            echo "=== Rollout ==="

            kubectl rollout status \
              deployment/taskflow-taskflow-chart \
              -n taskflow \
              --timeout=180s

            echo "=== Deployment Completed ==="

          EOF

      # ---------------------------------------------------------
      # STEP 3: Verify
      # ---------------------------------------------------------

      - name: Verify Deployment and Health
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << EOF

            set -e

            echo "=== Pods ==="
            kubectl get pods -n taskflow -o wide

            echo "=== Helm Release ==="
            helm list -n taskflow

            echo "=== Deployment ==="
            kubectl get deployment -n taskflow

            echo "=== Service ==="
            kubectl get service -n taskflow

            echo "=== Application Health ==="

            kubectl run curl-test \
              -n taskflow \
              --rm -i \
              --restart=Never \
              --image=curlimages/curl \
              -- curl -fsS \
              http://taskflow-taskflow-chart:5000/health

            echo
            echo "=== CD SUCCESS ==="

          EOF

