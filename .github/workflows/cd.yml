name: TaskFlow CD Pipeline

# Run CD after CI pipeline finishes
on:
  workflow_run:
    workflows: ["TaskFlow CI Pipeline"]
    types:
      - completed

# Global variables
env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: aws-terraform-platform-taskflow

  # Use CI commit SHA as image version
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:

    # Deploy only when CI succeeds
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:

      # Checkout the exact commit that passed CI
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Configure AWS access
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build Docker image
      - name: Build Docker Image
        run: |
          docker build -t taskflow-app:${{ env.IMAGE_TAG }} .

      # Tag image for ECR
      - name: Tag Docker Image
        run: |
          docker tag taskflow-app:${{ env.IMAGE_TAG }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      # Push image to ECR
      - name: Push Docker Image
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      # Install SSH client
      - name: Install SSH Client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      # Load EC2 SSH key
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # Copy the exact Helm chart to EC2
      - name: Copy Helm Chart to EC2
        run: |
          tar -czf taskflow-chart.tar.gz taskflow-chart

          scp -o StrictHostKeyChecking=no \
            taskflow-chart.tar.gz \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:/tmp/taskflow-chart.tar.gz

      # Deploy application to Kubernetes
      - name: Deploy Application to Kubernetes
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << EOF

            set -e

            # Install Helm on EC2 if it is not already installed
            if ! command -v helm >/dev/null 2>&1; then
              echo "Helm not found. Installing Helm..."
              curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
            else
              echo "Helm already installed: \$(helm version --short)"
            fi

            # Verify Helm installation
            helm version --short

            # Prepare namespace
            kubectl create namespace taskflow \
              --dry-run=client \
              -o yaml | kubectl apply -f -

            # Extract the Helm chart from the CI commit
            rm -rf /tmp/taskflow-chart
            tar -xzf /tmp/taskflow-chart.tar.gz -C /tmp

            # Login EC2 to ECR
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
            docker login \
              --username AWS \
              --password-stdin \
              ${{ steps.login-ecr.outputs.registry }}

            # Refresh Kubernetes ECR pull secret
            ECR_PASSWORD=\$(aws ecr get-login-password \
              --region ${{ env.AWS_REGION }})

            kubectl create secret docker-registry ecr-registry-secret \
              --docker-server=${{ steps.login-ecr.outputs.registry }} \
              --docker-username=AWS \
              --docker-password="\$ECR_PASSWORD" \
              -n taskflow \
              --dry-run=client \
              -o yaml | kubectl apply -f -

            # Install or upgrade Helm release
            helm upgrade --install taskflow /tmp/taskflow-chart \
              --namespace taskflow \
              --set image.repository=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }} \
              --set image.tag=${{ env.IMAGE_TAG }} \
              --set image.pullPolicy=Always \
              --wait \
              --timeout 180s

            # Wait for deployment rollout
            kubectl rollout status deployment/taskflow-taskflow-chart \
              -n taskflow \
              --timeout=180s

          EOF

      # Verify deployment and application health
      - name: Verify Kubernetes Deployment and Health
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'

            # Check Pods
            echo "=== Kubernetes Pods ==="
            kubectl get pods -n taskflow -o wide

            # Check Helm release
            echo "=== Helm Release ==="
            helm list -n taskflow

            # Check application health
            echo "=== Application Health ==="
            kubectl run curl-test \
              -n taskflow \
              --rm -i \
              --restart=Never \
              --image=curlimages/curl \
              -- curl -s --fail http://taskflow-taskflow-chart:5000/health

          EOF