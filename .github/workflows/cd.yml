name: TaskFlow CD Pipeline

on:
  workflow_run:
    workflows: ["TaskFlow CI Pipeline"]
    types:
      - completed

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: aws-terraform-platform-taskflow
  IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:

      # Checkout the exact commit that passed CI
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Configure AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push image
      - name: Build and Push Docker Image
        run: |
          docker build -t taskflow-app:${IMAGE_TAG} .

          docker tag taskflow-app:${IMAGE_TAG} \
            ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}

          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${IMAGE_TAG}

      # Install SSH
      - name: Install SSH Client
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-client

      # Load EC2 SSH key
      - name: Start SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # Install Helm on EC2 if it is not already installed
      - name: Install Helm on EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            'bash -s' << 'EOF'

          set -e

          if ! command -v helm >/dev/null 2>&1; then
            HELM_VERSION="v3.19.0"

            curl -fsSL \
              "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
              -o /tmp/helm.tar.gz

            tar -xzf /tmp/helm.tar.gz -C /tmp

            sudo install -m 0755 \
              /tmp/linux-amd64/helm \
              /usr/local/bin/helm

            rm -rf /tmp/helm.tar.gz /tmp/linux-amd64
          fi

          EOF

      # Deploy the new image using Helm
      - name: Deploy to EC2 Kubernetes
        run: |
          ssh -o StrictHostKeyChecking=no \
            "${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}" \
            'bash -s' << EOF

          set -e

          REPO_DIR=/home/ec2-user/taskflow-project

          if [ ! -d "\$REPO_DIR/.git" ]; then
            git clone \
              https://github.com/Bharathi5464/taskflow-devops-platform.git \
              "\$REPO_DIR"
          fi

          cd "\$REPO_DIR"

          git fetch origin
          git reset --hard
          git clean -fd
          git checkout "${IMAGE_TAG}"

          kubectl create namespace taskflow \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          ECR_PASSWORD=\$(aws ecr get-login-password \
            --region "${AWS_REGION}")

          kubectl create secret docker-registry ecr-registry-secret \
            --docker-server="${{ steps.login-ecr.outputs.registry }}" \
            --docker-username=AWS \
            --docker-password="\$ECR_PASSWORD" \
            -n taskflow \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          helm upgrade --install taskflow ./taskflow-chart \
            --namespace taskflow \
            --set image.repository="${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}" \
            --set image.tag="${IMAGE_TAG}" \
            --set image.pullPolicy=Always \
            --wait \
            --timeout 180s \
            --atomic

          kubectl rollout status \
            deployment/taskflow-taskflow-chart \
            -n taskflow \
            --timeout=180s

          EOF