name: TaskFlow CI Pipeline
on:
  push:
    branches:
      - main
jobs:
  test_build:     #test and analysis
    runs-on: ubuntu-latest
   
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      
      - name: Run Automated Tests
        run: pytest --cov=app --cov-report=xml

      - name: SonarQube Code Analysis
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Bharathi5464_taskflow-devops-platform
            -Dsonar.organization=bharathi5464
            -Dsonar.qualitygate.wait=true
            -Dsonar.python.coverage.reportPaths=coverage.xml


      - name: Build Docker Image
        run: docker build -t taskflow-app:ci . 
      
      - name: Trivy Security Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taskflow-app:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true


          
          




